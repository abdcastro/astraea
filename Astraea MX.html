var PAGES = {"home":"\n\n\n<div style=\"position: relative; background: #000; min-height: 100vh;\">\n\n  \n\n  \n\n  \n  \n\n  <nav data-role=\"nav\" style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 40px; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); transition: backdrop-filter 400ms ease, background 400ms ease, padding 400ms ease, border-color 400ms ease; border-bottom: 1px solid transparent;\">\n    <a href=\"#home\" style=\"display: flex; align-items: center; gap: 10px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\">\n        <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\"></path>\n        <circle cx=\"50\" cy=\"50\" r=\"6\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\"></circle>\n      </svg>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #F5F3EE;\">ASTRAEA</span>\n    </a>\n    <div style=\"display: flex; align-items: center; gap: 28px;\">\n      <div style=\"display: flex; align-items: center; gap: 22px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;\">\n        <a href=\"#mx\" style=\"color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">MX</a>\n        <a href=\"#agentic\" style=\"color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">Agentic</a>\n        <a href=\"#gallery\" style=\"color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">Gallery</a>\n        <a href=\"#design\" style=\"color: #8E8 top>\n            <stop offset=\"0.18\" stop-color=\"#E3E1DB\"></stop>\n            <stop offset=\"0.35\" stop-color=\"#A9A9AD\"></stop>\n            <stop offset=\"0.5\" stop-color=\"#5E5F64\"></stop>\n            <stop offset=\"0.62\" stop-color=\"#E9E7E1\"></stop>\n            <stop offset=\"0.78\" stop-color=\"#3A3B3F\"></stop>\n            <stop offset=\"0.92\" stop-color=\"#17181B\"></stop>\n            <stop offset=\"1\" stop-color=\"#0A0B0D\"></stop>\n          </linearGradient>\n          <linearGradient id=\"ah-edge\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n            <stop offset=\"0\" stop-color=\"#F5F3EE\" stop-opacity=\"0.95\"></stop>\n            <stop offset=\"0.5\" stop-color=\"#8B8C90\" stop-opacity=\"0.6\"></stop>\n            <stop offset=\"1\" stop-color=\"#1F2024\" stop-opacity=\"0.9\"></stop>\n          </linearGradient>\n          <linearGradient id=\"ah-prism-r\" x1=\"0.3\" y1=\"0.7\" x2=\"1\" y2=\"0.95\">\n            <stop offset=\"0\" stop-color=\"oklch(72% 0.24 30)\" stop-opacity=\"0\"></stop>\n            <stop offset=\"0.5\" stop-color=\"oklch(72% 0.24 30)\" stop-opacity=\"1\"></stop>\n            <stop offset=\"1\" stop-color=\"oklch(72% 0.24 30)\" stop-opacity=\"0\"></stop>\n          </linearGradient>\n          <linearGradient id=\"ah-prism-b\" x1=\"0\" y1=\"0.95\" x2=\"0.7\" y2=\"0.7\">\n            <stop offset=\"0\" stop-color=\"oklch(72% 0.24 240)\" stop-opacity=\"0\"></stop>\n            <stop offset=\"0.5\" stop-color=\"oklch(72% 0.24 240)\" stop-opacity=\"1\"></stop>\n            <stop offset=\"1\" stop-color=\"oklch(72% 0.24 240)\" stop-opacity=\"0\"></stop>\n          </linearGradient>\n          <radialGradient id=\"ah-core\" cx=\"0.38\" cy=\"0.35\" r=\"0.75\">\n            <stop offset=\"0\" stop-color=\"#FFFFFF\"></stop>\n            <stop offset=\"0.4\" stop-color=\"#F5F3EE\"></stop>\n            <stop offset=\"0.85\" stop-color=\"#8B8C90\"></stop>\n            <stop offset=\"1\" stop-color=\"#1F2024\"></stop>\n          </radialGradient>\n        </defs>\n        <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"url(#ah-metal)\" stroke=\"url(#ah-edge)\" stroke-width=\"0.6\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\"></path>\n        <g style=\"opacity: calc(0.8 * var(--prism-intensity)); mix-blend-mode: screen;\">\n          <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"none\" stroke=\"url(#ah-prism-r)\" stroke-width=\"0.9\" transform=\"translate(0.6 0.3)\"></path>\n          <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"none\" stroke=\"url(#ah-prism-b)\" stroke-width=\"0.9\" transform=\"translate(-0.6 0.3)\"></path>\n        </g>\n        <circle cx=\"50\" cy=\"50\" r=\"7\" fill=\"url(#ah-core)\" stroke=\"url(#ah-edge)\" stroke-width=\"0.4\"></circle>\n        <circle cx=\"48\" cy=\"48\" r=\"2\" fill=\"rgba(255,255,255,0.9)\"></circle>\n      </svg>\n    </div>\n\n    <h1 style=\"font-size: clamp(56px, 15vw, 236px); font-weight: 300; line-height: 0.86; letter-spacing: -0.055em; margin: 0 0 clamp(24px, 3.4vh, 40px);\">Astraea</h1>\n\n    <div style=\"display: flex; align-items: center; gap: clamp(14px, 2.4vw, 30px); flex-wrap: wrap; justify-content: center; font-family: 'Geist Mono', monospace; font-size: clamp(11px, 1.15vw, 14px); letter-spacing: 0.16em; text-transform: uppercase;\">\n      <span style=\"color: #F5F3EE;\">Preserve the future.</span>\n      <span style=\"width: clamp(24px, 5vw, 72px); height: 1px; background: rgba(245,243,238,0.28);\"></span>\n      <span style=\"background: linear-gradient(92deg, #fff 0%, #fff 30%, oklch(78% calc(0.14 * var(--prism-intensity)) 200) 44%, oklch(74% calc(0.18 * var(--prism-intensity)) 320) 58%, oklch(82% calc(0.16 * var(--prism-intensity)) 60) 72%, #fff 90%); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: prismShift 14s linear infinite;\">Make AI efficient.</span>\n    </div>\n\n    <div style=\"position: absolute; bottom: 34px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #3A3935;\">Scroll</span>\n      <span style=\"width: 1px; height: 26px; background: linear-gradient(180deg, rgba(245,243,238,0.5), transparent); animation: astScrollHint 2.4s ease-in-out infinite;\"></span>\n    </div>\n  </section>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(90px, 12vh, 150px) 40px;\">\n    <div style=\"max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(40px, 6vw, 100px);\">\n      <div data-reveal=\"1\" style=\"opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <div style=\"position: sticky; top: 120px; display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F5F3EE; box-shadow: 0 0 10px rgba(245,243,238,0.8); animation: astPulse 2.4s ease-in-out infinite;\"></span>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8E8C86;\">The company</span>\n          </div>\n          <p style=\"font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 1.8; letter-spacing: 0.06em; color: #B8B6B0; max-width: 220px; margin: 0;\">An AI company working on the efficiency of AI models and tools people need to keep up with them.</p>\n        </div>\n      </div>\n      <div data-reveal=\"1\" style=\"grid-column: span 2; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 80ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 80ms;\">\n        <p style=\"font-size: clamp(26px, 3.1vw, 46px); font-weight: 300; line-height: 1.22; letter-spacing: -0.025em; margin: 0 0 40px; text-wrap: pretty;\">AI is getting more capable faster than it is getting cheaper, and faster than people can adapt to it. <span style=\"color: #8E8C86;\">We work on both halves of that problem.</span></p>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 32px; border-top: 1px solid rgba(245,243,238,0.1); padding-top: 32px;\">\n          <div>\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #8E8C86; margin-bottom: 12px;\">— Efficiency</div>\n            <p style=\"font-size: 14px; line-height: 1.65; color: #8E8C86; margin: 0; max-width: 320px;\">Making language models cost less power per answer, by routing each question to the smallest model that can answer it.</p>\n          </div>\n          <div>\n            <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #8E8C86; margin-bottom: 12px;\">— Coexistence</div>\n            <p style=\"font-size: 14px; line-height: 1.65; color: #8E8C86; margin: 0; max-width: 320px;\">Building the agents, safeguards, and studios that let people work alongside an exponential curve inst px); align-items: start; max-width: 1120px;\">\n        <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: #8E8C86; margin: 0; text-wrap: pretty;\">MX is an <span style=\"color: #F5F3EE;\">Adaptive Language Model</span>. Not one large network answering everything, but many small ones behind a router that reads each input and sends it to the smallest model capable of answering it.</p>\n        <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: #8E8C86; margin: 0; text-wrap: pretty;\">Most questions never needed a frontier model. Paying frontier compute for all of them is the inefficiency we set out to remove. MX is up to <span style=\"color: #F5F3EE;\">30× more efficient</span> than modern flagship models.</p>\n      </div>\n    </div>\n\n    <div style=\"max-width: 1360px; margin: clamp(50px, 8vh, 90px) auto 0; width: 100%; padding-bottom: clamp(40px, 6vh, 70px);\">\n      <div style=\"display: flex; justify-content: space-between; gap: 20px; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #3A3935; padding-bottom: 14px; border-bottom: 1px solid rgba(245,243,238,0.08);\">\n        <span>Input</span><span>Router</span><span>Model pool</span>\n      </div>\n      <div id=\"mx-wide-diagram\">\n      <svg viewBox=\"0 0 1200 372\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" style=\"width: 100%; height: auto; display: block; margin-top: 18px; overflow: visible;\">\n        <defs>\n          <linearGradient id=\"mx-wire\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\" stop-color=\"#F5F3EE\" stop-opacity=\"0.1\"></stop>\n            <stop offset=\"0.5\" stop-color=\"#F5F3EE\" stop-opacity=\"0.5\"></stop>\n            <stop offset=\"1\" stop-color=\"#F5F3EE\" stop-opacity=\"0.12\"></stop>\n          </linearGradient>\n          <linearGradient id=\"mx-live\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\" stop- \" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"726\" cy=\"244\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 5.2s ease-in-out infinite 0.9s;\"></circle>\n            <text x=\"748\" y=\"251\" fill=\"#8E8C86\">14B</text>\n            <text x=\"994\" y=\"251\" text-anchor=\"end\" fill=\"#3A3935\">code</text>\n          </g>\n          <g>\n            <rect x=\"700\" y=\"292\" width=\"320\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"726\" cy=\"312\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 6s ease-in-out infinite 1.4s;\"></circle>\n            <text x=\"748\" y=\"319\" fill=\"#8E8C86\">32B</text>\n            <text x=\"994\" y=\"319\" text-anchor=\"end\" fill=\"#3A3935\">long ctx</text>\n          </g>\n        </g>\n      </svg>\n      </div>\n      <div id=\"mx-stack-diagram\" style=\"display:none;\">\n      <svg viewBox=\"0 0 420 600\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" style=\"width: 100%; height: auto; display: block; margin-top: 18px; overflow: visible;\">\n        <defs>\n          <linearGradient id=\"mx-wire\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\" stop-color=\"#F5F3EE\" stop-opacity=\"0.1\"></stop>\n            <stop offset=\"0.5\" stop-color=\"#F5F3EE\" stop-opacity=\"0.5\"></stop>\n            <stop offset=\"1\" stop-color=\"#F5F3EE\" stop-opacity=\"0.12\"></stop>\n          </linearGradient>\n          <linearGradient id=\"mx-live\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\" stop-color=\"oklch(78% 0.16 200)\"></stop>\n            <stop offset=\"0.5\" stop-color=\"oklch(74% 0.18 320)\"></stop>\n            <stop offset=\"1\" stop-color=\"oklch(82% 0.16 60)\"></stop>\n          </linearGradient>\n          <linearGradient id=\"mx-metal\" x1=\"0.2\" y1=\"0\" x2=\"0.8\" y2=\"1\">\n            <stop offset=\"0\" stop-color=\"#FCFAF4\"></stop>\n            <stop offset=\"0.35\" stop-color=\"#A9A9AD\"></stop>\n            <stop offset=\"0.55\" stop-color=\"#5E5F64\"></stop>\n            <stop offset=\"0.78\" stop-color=\"#3A3B3F\"></stop>\n            <stop offset=\"1\" stop-color=\"#0A0B0D\"></stop>\n          </linearGradient>\n        </defs>\n        <line x1=\"44\" y1=\"34\" x2=\"44\" y2=\"120\" stroke=\"url(#mx-wire)\" stroke-width=\"1.5\"></line>\n        <line x1=\"44\" y1=\"34\" x2=\"44\" y2=\"120\" stroke=\"url(#mx-live)\" stroke-width=\"1.8\" stroke-dasharray=\"22 64\" style=\"animation: mxFlow 3.2s linear infinite; opacity: calc(0.9 * var(--prism-intensity));\"></line>\n        <circle cx=\"44\" cy=\"34\" r=\"5\" fill=\"#F5F3EE\"></circle>\n        <text x=\"66\" y=\"41\" fill=\"#8E8C86\" font-family=\"'Geist Mono', monospace\" font-size=\"20\" letter-spacing=\"1.4\">prompt</text>\n        <g transform=\"translate(44 156)\">\n          <rect x=\"-27\" y=\"-27\" width=\"54\" height=\"54\" fill=\"none\" stroke=\"url(#mx-metal)\" stroke-width=\"3\" style=\"transform-box: fill-box; transform-origin: center; animation: mxRouter 8s ease-in-out infinite;\"></rect>\n          <circle cx=\"0\" cy=\"0\" r=\"5.5\" fill=\"#F5F3EE\"></circle>\n          <text x=\"44\" y=\"7\" fill=\"#F5F3EE\" font-family=\"'Geist Mono', monospace\" font-size=\"20\" letter-spacing=\"1.4\" text-anchor=\"start\">route</text>\n        </g>\n        <g stroke=\"url(#mx-wire)\" stroke-width=\"1.5\" fill=\"none\">\n          <path d=\"M 44 186 L 44 542\"></path>\n          <path d=\"M 44 246 L 92 246\"></path>\n          <path d=\"M 44 320 L 92 320\"></path>\n          <path d=\"M 44 394 L 92 394\"></path>\n          <path d=\"M 44 468 L 92 468\"></path>\n          <path d=\"M 44 542 L 92 542\"></path>\n        </g>\n        <path d=\"M 44 186 L 44 320 L 92 320\" fill=\"none\" stroke=\"url(#mx-live)\" stroke-width=\"2\" stroke-dasharray=\"30 260\" style=\"animation: mxFlow 3.2s linear infinite 0.55s; opacity: calc(0.95 * var(--prism-intensity));\"></path>\n        <g font-family=\"'Geist Mono', monospace\" font-size=\"19\" letter-spacing=\"1.2\">\n          <g>\n            <rect x=\"92\" y=\"226\" width=\"316\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"116\" cy=\"246\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 4s ease-in-out infinite 0s;\"></circle>\n            <text x=\"136\" y=\"253\" fill=\"#8E8C86\">0.4B</text>\n            <text x=\"386\" y=\"253\" text-anchor=\"end\" fill=\"#3A3935\">lookup</text>\n          </g>\n          <g>\n            <rect x=\"92\" y=\"300\" width=\"316\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.4)\"></rect>\n            <circle cx=\"116\" cy=\"320\" r=\"5\" fill=\"#F5F3EE\" style=\"animation: mxNode 2.2s ease-in-out infinite 0s;\"></circle>\n            <text x=\"136\" y=\"327\" fill=\"#F5F3EE\">3B</text>\n            <text x=\"386\" y=\"327\" text-anchor=\"end\" fill=\"#8E8C86\">selected</text>\n          </g>\n          <g>\n            <rect x=\"92\" y=\"374\" width=\"316\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"116\" cy=\"394\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 4.6s ease-in-out infinite 0.4s;\"></circle>\n            <text x=\"136\" y=\"401\" fill=\"#8E8C86\">8B</text>\n            <text x=\"386\" y=\"401\" text-anchor=\"end\" fill=\"#3A3935\">reasoning</text>\n          </g>\n          <g>\n            <rect x=\"92\" y=\"448\" width=\"316\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"116\" cy=\"468\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 5.2s ease-in-out infinite 0.9s;\"></circle>\n            <text x=\"136\" y=\"475\" fill=\"#8E8C86\">14B</text>\n            <text x=\"386\" y=\"475\" text-anchor=\"end\" fill=\"#3A3935\">code</text>\n          </g>\n          <g>\n            <rect x=\"92\" y=\"522\" width=\"316\" height=\"40\" rx=\"20\" fill=\"none\" stroke=\"rgba(245,243,238,0.16)\"></rect>\n            <circle cx=\"116\" cy=\"542\" r=\"4\" fill=\"#8E8C86\" style=\"animation: mxNode 6s ease-in-out infinite 1.4s;\"></circle>\n            <text x=\"136\" y=\"549\" fill=\"#8E8C86\">32B</text>\n            <text x=\"386\" y=\"549\" text-anchor=\"end\" fill=\"#3A3935\">long ctx</text>\n          </g>\n        </g>\n      </svg>\n      </div>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(90px, 13vh, 160px) 40px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; text-align: center;\">\n      <div data-reveal=\"1\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8E8C86; margin-bottom: 40px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">Adaptive Language Model</div>\n      <p data-reveal=\"1\" style=\"font-size: clamp(28px, 3.6vw, 56px); font-weight: 300; line-height: 1.18; letter-spacing: -0.03em; margin: 0; text-wrap: pretty; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 80ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 80ms;\">A single large model spends the same energy on <span style=\"color: #8E8C86;\">\"what's the capital of Peru\"</span> as it does on a proof. <span style=\"color: #8E8C86;\">MX doesn't. It adapts the model to the question, not the question to the model.</span></p>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(90px, 12vh, 140px) 40px;\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-bottom: 56px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <h2 style=\"font-size: clamp(34px, 4.4vw, 64px); font-weight: 400; line-height: 1.02; letter-spacing: -0.03em; margin: 0;\">How a prompt moves.</h2>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #3A3935;\">Per input</span>\n      </div>\n\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1px; background: rgba(245,243,238,0.1); border: 1px solid rgba(245,243,238,0.1); border-radius: 8px; overflow: hidden; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <div style=\"background: #000; padding: 34px 28px 40px; transition: background 400ms;\" style-hover=\"background: rgba(245,243,238,0.03);\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #3A3935; margin-bottom: 26px;\">01</div>\n          <h3 style=\"font-size: 20px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 14px;\">Read</h3>\n          <p style=\"font-size: 13px; line-height: 1.6; color: #8E8C86; margin: 0;\">A lightweight classifier reads the input for domain, ambiguity, and reasoning depth.</p>\n        </div>\n        <div style=\"background: #000; padding: 34px 28px 40px; transition: background 400ms;\" style-hover=\"background: rgba(245,243,238,0.03);\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #3A3935; margin-bottom: 26px;\">02</div>\n          <h3 style=\"font-size: 20px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 14px;\">Route</h3>\n          <p style=\"font-size: 13px; line-height: 1.6; color: #8E8C86; margin: 0;\">It picks the smallest model in the pool that clears the quality bar for that input.</p>\n        </div>\n        <div style=\"background: #000; padding: 34px 28px 40px; transition: background 400ms;\" style-hover=\"background: rgba(245,243,238,0.03);\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #3A3935; margin-bottom: 26px;\">03</div>\n          <h3 style=\"font-size: 20px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 14px;\">Answer</h3>\n          <p style=\"font-size: 13px; line-height: 1.6; color: #8E8C86; margin: 0;\">Only that model runs. Nothing else in the pool spends a watt on the request.</p>\n        </div>\n        <div style=\"background: #000; padding: 34px 28px 40px; transition: background 400ms;\" style-hover=\"background: rgba(245,243,238,0.03);\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #3A3935; margin-bottom: 26px;\">04</div>\n          <h3 style=\"font-size: 20px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 14px;\">Escalate</h3>\n          <p style=\"font-size: 13px; line-height: 1.6; color: #8E8C86; margin: 0;\">If confidence falls short, the request moves up the pool, the exception, not the default.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(90px, 12vh, 140px) 40px;\">\n    <div style=\"max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: repea "color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">← Astraea</a>\n          <a href=\"https://astraea.mx\" target=\"_blank\" rel=\"noreferrer\" style=\"color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">astraea.mx ↗</a>\n        </div>\n      </footer>\n      <div style=\"margin-top: 64px; padding-top: 24px; border-top: 1px solid rgba(245,243,238,0.08); display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8E8C86;\">\n        <span style=\"text-transform: uppercase;\">© 2026 Astraea Gallery</span>\n        <span style=\"text-transform: uppercase;\">Design mockup</span>\n      </div>\n    </div>\n  </section>\n</div>\n\n","virtus":"\n\n\n<div style=\"position: relative; background: #000; min-height: 100vh;\">\n\n  \n\n  \n\n  <nav data-role=\"nav\" style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 40px; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); transition: backdrop-filter 400ms ease, background 400ms ease, padding 400ms ease, border-color 400ms ease; border-bottom: 1px solid transparent;\">\n    <a href=\"#gallery\" style=\"display: flex; align-items: center; gap: 10px;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\">\n        <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\"></path>\n        <circle cx=\"50\" cy=\"50\" r=\"6\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\"></circle>\n      </svg>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #F5F3EE;\">ASTRAEA<span style=\"color: #8E8C86;\"> / GALLERY / VIRTUS</span></span>\n    </a>\n    <div style=\"display: flex; align-items: center; gap: 24px;\">\n      <a href=\"#demo\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86; transition: color 200ms;\" style-hover=\"color: #F5F3EE;\">Demo</a>\n      <a href=\"#papers\" style=\"display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 1px solid rgba(245,243,238,0.18); border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #F5F3EE; background: rgba(245,243,238,0.02); transition: background 200ms, border-color 200ms, transform 200ms;\" style-hover=\"background: rgba(245,243,238,0.08); border-color: #F5F3EE; transform: translateY(-1px);\">\n        <span>The paper</span>\n        <span>→</span>\n      </a>\n    </div>\n  </nav>\n\n  <section style=\"position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 150px 40px clamp(50px, 8vh, 90px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: clamp(40px, 6vw, 90px); align-items: center;\">\n    <div>\n      <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 34px;\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F5F3EE; box-shadow: 0 0 10px rgba(245,243,238,0.8); animation: astPulse 2.4s ease-in-out infinite;\"></span>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">Gallery / Virtus</span>\n      </div>\n      <h1 style=\"font-size: clamp(44px, 7.6vw, 128px); font-weight: 300; line-height: 0.92; letter-spacing: -0.05em; margin: 0 0 30px;\">Virtus is the <span style=\"color: #8E8C86;\">God of Valor.</span></h1>\n      <p style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86; margin: 0 0 34px;\">Anti-AI CAPTCHA challenge</p>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: clamp(24px, 4vw, 60px); padding-top: 34px; border-top: 1px solid rgba(245,243,238,0.1);\">\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.6; color: #F5F3EE; margin: 0; text-wrap: pretty;\">Every mainstream CAPTCHA has fallen. Agentic vision models now solve unseen challenges at over 70% — perception puzzles and reasoning puzzles alike. The door is open.</p>\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.6; color: #8E8C86; margin: 0; text-wrap: pretty;\">Virtus closes it by changing the ground. Instead of asking a machine to see harder, it asks for something machines cannot do at all: perceive a shape that exists only across time.</p>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center;\">\n      <svg viewBox=\"0 0 100 100\" width=\"min(300px, 62vw)\" height=\"min(300px, 62vw)\" aria-hidden=\"true\" style=\"overflow: visible;\">\n        <g fill=\"#F5F3EE\">\n          <rect x=\"26\" y=\"12\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite;\"></rect>\n          <rect x=\"58\" y=\"12\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.15s;\"></rect>\n          <rect x=\"6\" y=\"30\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.55s;\"></rect>\n          <rect x=\"26\" y=\"30\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.4s;\"></rect>\n          <rect x=\"42\" y=\"30\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.28s;\"></rect>\n          <rect x=\"58\" y=\"30\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.4s;\"></rect>\n          <rect x=\"78\" y=\"30\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.55s;\"></rect>\n          <rect x=\"42\" y=\"48\" width=\"16\" height=\"16\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.7s;\"></rect>\n          <rect x=\"34\" y=\"66\" width=\"32\" height=\"14\" style=\"animation: glBlockOn 3.6s ease-in-out infinite 0.85s;\"></rect>\n        </g>\n        <rect x=\"-6\" y=\"46\" width=\"112\" height=\"1.5\" fill=\"rgba(245,243,238,0.5)\" style=\"animation: glScan 3.6s linear infinite;\"></rect>\n      </svg>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(70px, 10vh, 120px) 40px clamp(30px, 5vh, 60px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1px; background: rgba(245,243,238,0.1); border: 1px solid rgba(245,243,238,0.1); border-radius: 8px; overflow: hidden;\">\n      <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #8E8C86; margin-bottom: 22px;\">The challenge</div>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">Two seconds of visual static. A simple shape moves inside it — a square, a circle, a triangle, or nothing at all.</p>\n      </div>\n      <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 70ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 70ms;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #8E8C86; margin-bottom: 22px;\">The mechanism</div>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">The background regenerates its noise every frame. Inside the shape, the old noise is preserved — a window of stillness in a fizzing field.</p>\n      </div>\n      <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 140ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 140ms;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #8E8C86; margin-bottom: 22px;\">The result</div>\n        <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">A person sees the shape immediately. A model given any single frame sees noise — because in that frame, that is all there is.</p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"demo\" style=\"position: relative; z-index: 1; padding: clamp(50px, 8vh, 90px) 40px clamp(60px, 9vh, 100px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-bottom: 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <h2 style=\"font-size: clamp(34px, 4.4vw, 64px); font-weight: 400; line-height: 1.02; letter-spacing: -0.03em; margin: 0;\">Try an example.</h2>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8E8C86;\">Live challenge · 2 seconds</span>\n      </div>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: clamp(30px, 4vw, 60px); align-items: start; padding: clamp(26px, 3.2vw, 42px); border: 1px solid rgba(245,243,238,0.16); border-radius: 10px; background: linear-gradient(180deg, rgba(245,243,238,0.04), rgba(245,243,238,0.008));\">\n        <div style=\"display: flex; flex-direction: column; gap: 24px; order: 2;\">\n          <video src=\"assets/virtus-demo.mp4\" autoplay=\"autoplay\" loop=\"loop\" muted=\"muted\" playsinline=\"playsinline\" controls=\"controls\" style=\"width: 100%; border-radius: 8px; border: 1px solid rgba(245,243,238,0.14); display: block; background: #0E0E0E;\"></video>\n          <p style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8E8C86; margin: 0;\">Generated by the Virtus algorithm. No shape is drawn — only preserved.</p>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 22px; order: 1;\">\n          <h3 style=\"font-size: clamp(20px, 2vw, 26px); font-weight: 400; line-height: 1.2; letter-spacing: -0.02em; margin: 0;\">Select the true statement based on the video</h3>\n          <div id=\"virtus-options\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <button type=\"button\" data-label=\"A square is moving clockwise\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; border-radius: 8px; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; cursor: pointer; transition: border-color 200ms, background 200ms, color 200ms; border: 1px solid rgba(245,243,238,0.14); background: rgba(245,243,238,0.02); color: #F5F3EE;\"><span>A square is moving clockwise</span><span class=\"tick\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px;\"></span></button>\n            <button type=\"button\" data-label=\"A square is moving counter-clockwise\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; border-radius: 8px; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; cursor: pointer; transition: border-color 200ms, background 200ms, color 200ms; border: 1px solid rgba(245,243,238,0.14); background: rgba(245,243,238,0.02); color: #F5F3EE;\"><span>A square is moving counter-clockwise</span><span class=\"tick\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px;\"></span></button>\n            <button type=\"button\" data-label=\"A circle is moving clockwise\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; border-radius: 8px; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; cursor: pointer; transition: border-color 200ms, background 200ms, color 200ms; border: 1px solid rgba(245,243,238,0.14); background: rgba(245,243,238,0.02); color: #F5F3EE;\"><span>A circle is moving clockwise</span><span class=\"tick\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px;\"></span></button>\n            <button type=\"button\" data-label=\"A circle is moving counter-clockwise\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; border-radius: 8px; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; cursor: pointer; transition: border-color 200ms, background 200ms, color 200ms; border: 1px solid rgba(245,243,238,0.14); background: rgba(245,243,238,0.02); color: #F5F3EE;\"><span>A circle is moving counter-clockwise</span><span class=\"tick\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px;\"></span></button>\n            <button type=\"button\" data-label=\"None of the above\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 16px 20px; border-radius: 8px; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; cursor: pointer; transition: border-color 200ms, background 200ms, color 200ms; border: 1px solid rgba(245,243,238,0.14); background: rgba(245,243,238,0.02); color: #F5F3EE;\"><span>None of the above</span><span class=\"tick\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px;\"></span></button>\n          </div>\n          <div id=\"virtus-verdict\" style=\"display: none; flex-direction: column; gap: 10px; padding: 20px 22px; border: 1px solid rgba(245,243,238,0.16); border-radius: 8px; background: rgba(245,243,238,0.03); animation: apFade 500ms cubic-bezier(0.2,0.8,0.2,1) both;\">\n            <span id=\"virtus-verdict-title\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8E8C86;\"></span>\n            <p id=\"virtus-verdict-body\" style=\"font-size: 14.5px; line-height: 1.6; color: #F5F3EE; margin: 0;\"></p>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(20px, 4vh, 50px) 40px clamp(80px, 12vh, 130px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(30px, 5vw, 80px); align-items: start;\">\n      <h2 data-reveal=\"1\" style=\"font-size: clamp(28px, 3.6vw, 52px); font-weight: 300; line-height: 1.06; letter-spacing: -0.035em; margin: 0; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">Easy? Go back and pause the video. In the blink of an eye, the shape will disappear.</h2>\n      <p data-reveal=\"1\" style=\"font-size: clamp(16px, 1.35vw, 19px); line-height: 1.6; color: #8E8C86; margin: 0; text-wrap: pretty; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 90ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 90ms;\">The human visual system detects temporal coherence (stability over time) while AI vision systems only analyze spatial statistics frame-by-frame. The noise in both regions is statistically identical, so AI cannot distinguish them.</p>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(70px, 10vh, 120px) 40px clamp(60px, 9vh, 100px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <h2 style=\"font-size: clamp(34px, 4.4vw, 64px); font-weight: 400; line-height: 1.02; letter-spacing: -0.03em; margin: 0;\">What the tests found.</h2>\n        <a href=\"#papers\" style=\"font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #F5F3EE;\">Read the paper →</a>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 1px; background: rgba(245,243,238,0.1); border: 1px solid rgba(245,243,238,0.1); border-radius: 8px; overflow: hidden;\">\n        <div style=\"background: #000; padding: 34px 30px 40px;\">\n          <div style=\"font-size: clamp(34px, 4vw, 52px); font-weight: 300; letter-spacing: -0.04em; line-height: 1;\">0%</div>\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86; margin-top: 12px;\">SOTA model solve rate< minmax(min(100%, 280px), 1fr)); gap: clamp(24px, 4vw, 60px); padding-top: 34px; border-top: 1px solid rgba(245,243,238,0.1);\">\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.6; color: #F5F3EE; margin: 0; text-wrap: pretty;\">Insider trading survives because it pays. Detection is slow, proof is expensive, and by the time anyone acts the position has already closed.</p>\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.6; color: #8E8C86; margin: 0; text-wrap: pretty;\">Apollo doesn't prosecute. It removes the payout — turning stolen foresight into a signal everyone gets at once.</p>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; justify-content: center;\">\n      <svg viewBox=\"0 0 100 100\" width=\"min(320px, 66vw)\" height=\"min(320px, 66vw)\" aria-hidden=\"true\">\n        <g fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\">\n          <circle cx=\"50\" cy=\"50\" r=\"40\"></circle>\n          <circle cx=\"50\" cy=\"50\" r=\"26\"></circle>\n          <circle cx=\"50\" cy=\"50\" r=\"13\"></circle>\n        </g>\n        <circle cx=\"50\" cy=\"50\" r=\"5.5\" fill=\"#F5F3EE\"></circle>\n        <g style=\"transform-origin: 50px 50px; animation: glSpin 16s linear infinite;\">\n          <circle cx=\"90\" cy=\"50\" r=\"4\" fill=\"#F5F3EE\"></circle>\n        </g>\n        <g style=\"transform-origin: 50px 50px; animation: glSpinBack 10s linear infinite;\">\n          <circle cx=\"50\" cy=\"24\" r=\"3.2\" fill=\"#F5F3EE\"></circle>\n        </g>\n        <g style=\"transform-origin: 50px 50px; animation: glSpin 6.5s linear infinite;\">\n          <circle cx=\"37\" cy=\"50\" r=\"2.4\" fill=\"#F5F3EE\"></circle>\n        </g>\n      </svg>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section id=\"how\" style=\"position: relative; z-index: 1; padding: clamp(70px, 10vh, 120px) 40px clamp(50px, 8vh, 90px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <h2 style=\"font-size: clamp(34px, 4.4vw, 64px); font-weight: 400; line-height: 1.02; letter-spacing: -0.03em; margin: 0;\">Hunt, then flood.</h2>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8E8C86;\">Runs on Astraea MX</span>\n      </div>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px;\">\n        <div data-reveal=\"1\" style=\"display: flex; flex-direction: column; gap: 22px; padding: clamp(28px, 3.4vw, 44px); border: 1px solid rgba(245,243,238,0.16); border-radius: 10px; background: linear-gradient(180deg, rgba(245,243,238,0.04), rgba(245,243,238,0.008)); opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n          <div style=\"display: flex; align-items: center; gap: 14px;\">\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #8E8C86;\">01</span>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8E8C86;\">Detection</span>\n          </div>\n          <h3 style=\"font-size: clamp(24px, 2.6vw, 34px); font-weight: 300; line-height: 1.06; letter-spacing: -0.03em; margin: 0;\">We hunt for insiders.</h3>\n          <p style=\"font-size: 15.5px; line-height: 1.65; color: #8E8C86; margin: 0; text-wrap: pretty;\">Using <a href=\"#mx\" style=\"color: #F5F3EE; border-bottom: 1px solid rgba(245,243,238,0.3);\">Astraea MX</a>, Apollo monitors millions of accounts in real-time. We actively hunt for insiders by analyzing trading history, win percentages, and highly improbable bet sizing.</p>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 4px;\">\n            <div style=\"display: flex; align-items: center; gap: 14px;\">\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8E8C86; width: 130px;\">Trading history</span>\n              <span style=\"flex: 1; height: 3px; background: rgba(245,243,238,0.10); border-radius: 2px; position: relative; overflow: hidden;\"><span style=\"position: absolute; inset: 0; width: 62%; background: rgba(245,243,238,0.5); border-radius: 2px;\"></span></span>\n            </div>\n            <div style=\"display: flex; align-items: center; gap: 14px;\">\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8E8C86; width: 130px;\">Win percentage</span>\n              <span style=\"flex: 1; height: 3px; background: rgba(245,243,238,0.10); border-radius: 2px; position: relative; overflow: hidden;\"><span style=\"position: absolute; inset: 0; width: 88%; background: rgba(245,243,238,0.72); border-radius: 2px;\"></span></span>\n            </div>\n            <div style=\"display: flex; align-items: center; gap: 14px;\">\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8E8C86; width: 130px;\">Bet sizing</span>\n              <span style=\"flex: 1; height: 3px; background: rgba(245,243,238,0.10); border-radius: 2px; position: relative; overflow: hidden;\"><span style=\"position: absolute; inset: 0; width: 97%; background: #F5F3EE; border-radius: 2px;\"></span></span>\n            </div>\n          </div>\n        </div>\n\n        <div data-reveal=\"1\" style=\"display: flex; flex-direction: column; gap: 22px; padding: clamp(28px, 3.4vw, 44px); border: 1px solid rgba(245,243,238,0.16); border-radius: 10px; background: linear-gradient(180deg, rgba(245,243,238,0.04), rgba(245,243,238,0.008)); opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 90ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 90ms;\">\n          <div style=\"display: flex; align-items: center; gap: 14px;\">\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #8E8C86;\">02</span>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8E8C86;\">Response</span>\n          </div>\n          <h3 style=\"font-size: clamp(24px, 2.6vw, 34px); font-weight: 300; line-height: 1.06; letter-spacing: -0.03em; margin: 0;\">Then we crush the margin.</h3>\n          <p style=\"font-size: 15.5px; line-height: 1.65; color: #8E8C86; margin: 0; text-wrap: pretty;\">Once an insider is found, Apollo automatically copies their trades across our entire user network. By instantly flooding the market with these copied trades, Apollo rapidly balances the odds. The insider's profit margins are crushed, removing the financial incentive to cheat entirely.</p>\n          <div style=\"display: flex; flex-direction: column; gap: 7px; margin-top: 4px;\">\n            <span style=\"height: 3px; border-radius: 2px; background: #F5F3EE; transform-origin: left; animation: apFlood 2.6s cubic-bezier(0.2,0.8,0.2,1) infinite;\"></span>\n            <span style=\"height: 3px; border-radius: 2px; background: #F5F3EE; transform-origin: left; animation: apFlood 2.6s cubic-bezier(0.2,0.8,0.2,1) infinite 0.12s;\"></span>\n            <span style=\"height: 3px; border-radius: 2px; background: #F5F3EE; transform-origin: left; animation: apFlood 2.6s cubic-bezier(0.2,0.8,0.2,1) infinite 0.24s;\" ht: 1.55; color: #8E8C86; margin: 0; text-wrap: pretty;\">You may be selected for an interview after submitting the form below. The use of generative AI is allowed, but discouraged.</p>\n    </div>\n  </section>\n\n  <section id=\"openings\" style=\"position: relative; z-index: 1; padding: clamp(30px, 5vh, 60px) 40px clamp(50px, 8vh, 90px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid rgba(245,243,238,0.18);\">\n        <h2 style=\"font-size: clamp(26px, 3vw, 40px); font-weight: 400; line-height: 1.02; letter-spacing: -0.03em; margin: 0;\">Open roles.</h2>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #3A3935;\">Five · paid · remote</span>\n      </div>\n      <a href=\"#form\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 26px 6px; border-bottom: 1px solid rgba(245,243,238,0.08); transition: padding 300ms cubic-bezier(0.2,0.8,0.2,1), background 300ms;\" style-hover=\"padding-left: 20px; padding-right: 20px; background: rgba(245,243,238,0.03);\">\n        <span style=\"font-size: clamp(19px, 2vw, 26px); font-weight: 300; letter-spacing: -0.02em;\">AI Engineering Intern</span>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 14px; color: #8E8C86;\">→</span>\n      </a>\n      <a href=\"#form\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 26px 6px; border-bottom: 1px solid rgba(245,243,238,0.08); transition: padding 300ms cubic-bezier(0.2,0.8,0.2,1), background 300ms;\" style-hover=\"padding-left: 20px; padding-right: 20px; background: rgba(245,243,238,0.03);\">\n        <span style=\"font-size: clamp(19px, 2vw, 26px); font-weight: 300; letter-s </section>\n\n  <section id=\"form\" style=\"position: relative; z-index: 1; padding: clamp(40px, 7vh, 80px) 40px clamp(80px, 12vh, 130px);\">\n    <div style=\"max-width: 860px; margin: 0 auto;\">\n\n      <div id=\"apply-success\" style=\"display:none;\">\n        <div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding: clamp(40px, 6vw, 80px) clamp(28px, 4vw, 56px); border: 1px solid rgba(245,243,238,0.16); border-radius: 10px; background: linear-gradient(180deg, rgba(245,243,238,0.04), rgba(245,243,238,0.008)); animation: apFade 700ms cubic-bezier(0.2,0.8,0.2,1) both;\">\n          <svg width=\"42\" height=\"42\" viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\">\n            <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\" stroke-linejoin=\"miter\" stroke-miterlimit=\"4\"></path>\n            <circle cx=\"50\" cy=\"50\" r=\"6\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"2\"></circle>\n          </svg>\n          <h2 style=\"font-size: clamp(28px, 4vw, 52px); font-weight: 300; line-height: 1.04; letter-spacing: -0.035em; margin: 0;\">Thank you for your interest in Astraea.</h2>\n          <p style=\"font-size: 15px; line-height: 1.65; color: #8E8C86; margin: 0; max-width: 52ch;\">Your application has been received. If there's a fit, you'll hear from us about an interview.</p>\n          <a href=\"#home\" style=\"display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border: 1px solid rgba(245,243,238,0.18); border-radius: 999px; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #F5F3EE; background: rgba(245,243,238,0.02); transition: background 200ms, border-color 200ms, transform 200ms; margin-top: 8px;\" style-hover=\"background: rgba(245,243,238,0.08); border-color: #F5F3EE; transform: translateY(-1px);\">\n            <span>Back to Astraea</span>\n            <span>→</span>\n          </a>\n        </div>\n      </div>\n\n      <div id=\"apply-form-wrap\">\n        <form id=\"apply-form\" style=\"display: flex; flex-direction: column; gap: 34px;\">\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <label for=\"ap-role\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">Position</label>\n            <select id=\"ap-role\" required=\"required\" style=\"width: 100%; padding: 16px 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; appearance: none; transition: border-color 200ms;\">\n              <option value=\"\">Select a position…</option>\n              <option value=\"AI Engineering Intern\">AI Engineering Intern</option>\n              <option value=\"AI Research Intern\">AI Research Intern</option>\n              <option value=\"Software Engineer Intern: Aletheia\">Software Engineer Intern: Aletheia</option>\n              <option value=\"Developer Intern: Aletheia\">Developer Intern: Aletheia</option>\n              <option value=\"Software Engineer Intern: Apollo\">Software Engineer Intern: Apollo</option>\n            </select>\n          </div>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"ap-name\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">Name</label>\n              <input id=\"ap-name\" type=\"text\" required=\"required\" style=\"width: 100%; padding: 16px 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; transition: border-color 200ms;\" />\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"ap-email\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">Email</label>\n              <input id=\"ap-email\" type=\"email\" required=\"required\" style=\"width: 100%; padding: 16px 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; transition: border-color 200ms;\" />\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"ap-linkedin\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">LinkedIn (link)</label>\n              <input id=\"ap-linkedin\" type=\"url\" placeholder=\"https://\" style=\"width: 100%; padding: 16px 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; transition: border-color 200ms;\" />\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"ap-github\" style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">GitHub / personal website (link)</label>\n              <input id=\"ap-github\" type=\"url\" placeholder=\"https://\" style=\"width: 100%; padding: 16px 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; transition: border-color 200ms;\" />\n            </div>\n          </div>\n\n          <div style=\"height: 1px; background: rgba(245,243,238,0.08);\"></div>\n\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <p style=\"font-size: 15px; line-height: 1.65; color: #8E8C86; margin: 0; max-width: 62ch; text-wrap: pretty;\">Astraea looks for people with a track record of building. If you have shipped a product with 100k+ downloads, or created an open source project with 10k+ stars/downloads, your application will be fast-tracked.</p>\n            <label for=\"ap-built\" style=\"font-size: 15px; line-height: 1.6; color: #F5F3EE;\">What is something you've built? Include links, stats, etc.</label>\n            <textarea id=\"ap-built\" required=\"required\" rows=\"7\" style=\"width: 100%; padding: 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; line-height: 1.6; resize: vertical; transition: border-color 200ms;\"></textarea>\n          </div>\n\n          <div style=\"height: 1px; background: rgba(245,243,238,0.08);\"></div>\n\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <p style=\"font-size: 15px; line-height: 1.6; color: #F5F3EE; margin: 0;\">You are sitting at a table with 3 objects in front of you:</p>\n            <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; justify-items: center; padding: 26px 0; max-width: 560px;\">\n              <div style=\"width: 54px; height: 54px; background: #FF0000;\"></div>\n              <div style=\"width: 54px; height: 54px; background: #1F1FE0;\"></div>\n              <div style=\"width: 54px; height: 54px; border-radius: 50%; background: #FF0000;\"></div>\n            </div>\n            <p style=\"font-size: 15px; line-height: 1.65; color: #8E8C86; margin: 0; max-width: 62ch; text-wrap: pretty;\">A perfect logistician, sitting in across the table, was informed of a selected object among the 3. He needs you to guess the object based on a one word description. The logician says \"red\".</p>\n            <label for=\"ap-logic\" style=\"font-size: 15px; line-height: 1.6; color: #F5F3EE;\">What is the selected object? Explain your choice.</label>\n            <p style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8E8C86; margin: 0;\">You may attempt to use AI, but the result will likely be incorrect.</p>\n            <textarea id=\"ap-logic\" required=\"required\" rows=\"5\" style=\"width: 100%; padding: 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; line-height: 1.6; resize: vertical; transition: border-color 200ms;\"></textarea>\n          </div>\n\n          <div style=\"height: 1px; background: rgba(245,243,238,0.08);\"></div>\n\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"display: flex; gap: 14px; align-items: flex-start;\">\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #8E8C86; padding-top: 2px;\">a.</span>\n              <p style=\"font-size: 15px; line-height: 1.65; color: #F5F3EE; margin: 0; max-width: 62ch; text-wrap: pretty;\">Out of a box with N balls, numbered from 1 to N, you take out ball number 4. Which number has the highest probability of being N?</p>\n            </div>\n            <div style=\"display: flex; gap: 14px; align-items: flex-start;\">\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 13px; color: #8E8C86; padding-top: 2px;\">b.</span>\n              <p style=\"font-size: 15px; line-height: 1.65; color: #F5F3EE; margin: 0; max-width: 62ch; text-wrap: pretty;\">Out of 117 billion humans to have ever existed so far, you are more or less the 110 billionth. What number is the most likely to be the total amount of humans to ever exist?</p>\n            </div>\n            <p style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8E8C86; margin: 0;\">You may attempt to use AI, but the result will likely be incorrect.</p>\n            <textarea id=\"ap-prob\" required=\"required\" rows=\"6\" style=\"width: 100%; padding: 18px; border: 1px solid rgba(245,243,238,0.14); border-radius: 8px; background: #0E0E0E; color: #F5F3EE; font-size: 15px; line-height: 1.6; resize: vertical; transition: border-color 200ms;\"></textarea>\n          </div>\n\n          <button type=\"submit\" style=\"width: 100%; padding: 20px 24px; border: 1px solid #F5F3EE; border-radius: 999px; background: #F5F3EE; color: #000; font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 200ms, transform 200ms;\" style-hover=\"opacity: 0.85; transform: translateY(-1px);\">Submit</button>\n\n          <p style=\"font-family: 'Geist Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; color: #8E8C86; margin: -14px 0 0; text-align: center;\">Design mockup — submissions are not stored or sent.</p>\n        </form>\n      </div>\n    </div>\n  </section>\n\n  <div style=\"height: 1px; max-width: 1360px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(245,243,238,0.18) 20%, rgba(245,243,238,0.18) 80%, transparent);\"></div>\n\n  <section style=\"position: relative; z-index: 1; padding: clamp(70px, 10vh, 110px) 40px 60px;\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <footer style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 40px;\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 20px;\">\n            <svg width=\"28\" height=\"28\" viewBox=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\">\n              <path d=\"M 50.00 4.00 L 62.72 29.65 L 56.36 43.64 L 70.35 37.28 L 96.00 50.00 L 70.35 62.72 L 56.36 56.36 L 62.72 70.35 L 50.00 96.00 L 37.28 70.35 L 43.64 56.36 L 29.65 62.72 L 4.00 50.00 L 29.65 37.28 L 43.64 43.64 L 37.28 29.65 L 50.00 4.00 Z\" fill=\"no : grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); align-items: center; gap: clamp(40px, 5vw, 72px); max-width: 1440px; margin: 0 auto; padding: 150px 40px clamp(60px, 9vh, 110px);\">\n    <div style=\"width: 100%;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 34px;\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #F5F3EE; box-shadow: 0 0 10px rgba(245,243,238,0.8); animation: astPulse 2.4s ease-in-out infinite;\"></span>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8C86;\">Astraea / Design</span>\n      </div>\n\n      <h1 style=\"font-size: clamp(48px, 8.6vw, 152px); font-weight: 300; line-height: 0.92; letter-spacing: -0.05em; margin: 0 0 40px; max-width: 14ch;\">Designed with AI, <span style=\"color: #8E8C86;\">not by it.</span></h1>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: clamp(28px, 5vw, 80px); align-items: start; max-width: 1180px; padding-top: 34px; border-top: 1px solid rgba(245,243,238,0.1);\">\n        <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: #F5F3EE; margin: 0; text-wrap: pretty;\">Design is how Astraea builds sites and interfaces working alongside AI — a designer directing, models producing, and every decision still made by a person who has to defend it.</p>\n        <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.55; color: #8E8C86; margin: 0; text-wrap: pretty;\">The result is the pace of generation with the judgment of a studio. What ships is what a human chose, not what a model happened to output first.</p>\n      </div>\n    </div>\n    <div data-role=\"hero-visual\" style=\"position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 560px; justify-self: center; perspective: 1400px;\">\n      <div style=\"position: absolute; inset: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #3A3935;\">Four passes · one author</span>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 1px; background: rgba(245,243,238,0.1); border: 1px solid rgba(245,243,238,0.1); border-radius: 8px; overflow: hidden;\">\n        <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #3A3935; margin-bottom: 18px;\">01</div>\n          <div style=\"font-size: 19px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 16px;\">Direction</div>\n          <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">A written brief before a single pixel: audience, tone, what the page has to prove. The model gets the same constraints a designer would.</p>\n        </div>\n        <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 70ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 70ms;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #3A3935; margin-bottom: 18px;\">02</div>\n          <div style=\"font-size: 19px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 16px;\">Divergence</div>\n          <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">Several real directions built as working pages, not mockups. Generation is cheap, so nothing gets defended on the basis of effort.</p>\n        </div>\n        <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 140ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 140ms;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #3A3935; margin-bottom: 18px;\">03</div>\n          <div style=\"font-size: 19px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 16px;\">Judgment</div>\n          <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">A person picks, cuts, and rewrites. Taste is the part that doesn't get delegated — the model has no stake in whether it's good.</p>\n        </div>\n        <div data-reveal=\"1\" style=\"background: #000; padding: 38px 30px 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1) 210ms, transform 900ms cubic-bezier(0.2,0.8,0.2,1) 210ms;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #3A3935; margin-bottom: 18px;\">04</div>\n          <div style=\"font-size: 19px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 16px;\">Finish</div>\n          <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C86; margin: 0;\">Type, spacing, motion, and copy tuned by hand until the page reads as one voice. This is where AI output stops being obvious.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"work\" style=\"position: relative; z-index: 1; padding: clamp(50px, 7vh, 80px) 40px clamp(90px, 12vh, 140px);\">\n    <div style=\"max-width: 1360px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-bottom: 44px; opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(0.2,0.8,0.2,1), transform 900ms cubic-bezier(0.2,0.8,0.2,1);\">\n        <h2 style=\"font-si function scrollTop() { return (document.scrollingElement && document.scrollingElement.scrollTop) || document.documentElement.scrollTop || document.body.scrollTop || window.scrollY || 0; }

function setupSharedOverlay() {
  var coarse = window.matchMedia('(max-width: 820px), (pointer: coarse)').matches;
  if (!coarse) document.documentElement.style.cursor = 'none';
  var dot = document.getElementById('site-dot'), ring = document.getElementById('site-ring');
  if (!coarse && dot && ring) {
    dot.style.display = 'block'; ring.style.display = 'block';
    var mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
    window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; });
    window.addEventListener('mouseover', function(e){
      var t = e.target, hot = t && t.closest && t.closest('a, button, h1, h2, h3');
      ring.style.width = hot ? '64px' : '32px'; ring.style.height = hot ? '64px' : '32px';
      ring.style.borderColor = hot ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.55)';
    });
    (function loop(){
      rx += (mx-rx)*0.18; ry += (my-ry)*0.18;
      dot.style.transform = 'translate('+mx+'px,'+my+'px) translate(-50%,-50%)';
      ring.style.transform = 'translate('+rx+'px,'+ry+'px) translate(-50%,-50%)';
      requestAnimationFrame(loop);
    })();
  }
  var c = document.getElementById('site-star');
  if (c) {
    var ctx = c.getContext('2d'), dpr = window.devicePixelRatio||1, w=0,h=0,stars=[];
    function resize(){
      w = c.width = innerWidth*dpr; h = c.height = innerHeight*dpr;
      c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
      stars = Array.from({length:220}, function(){ return {x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+0.2,z:Math.random()*0.8+0.2,tw:Math.random()*Math.PI*2}; });
    }
    resize();
    window.addEventListener('resize', resize);
    var sy = 0;
    window.addEventListener('scroll', function(){ sy = scrollTop(); }, {passive:true});
    (function loop(t){
      ctx.clearRect(0,0,w,h);
      for (var i=0;i<stars.length;i++){
        var s = stars[i];
        var y = (s.y - sy*s.z*dpr*0.3) % h; var ay = y<0? y+h : y;
        var tw = 0.5 + Math.sin((t||0)*0.0015 + s.tw)*0.5;
        ctx.beginPath(); ctx.arc(s.x, ay, s.r*dpr, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(245,243,238,' + (0.15 + tw*0.7*s.z) + ')'; ctx.fill();
      }
      requestAnimationFrame(loop);
    })();
  }
}

var currentCleanups = [];
function on(t, ev, fn, opts) { t.addEventListener(ev, fn, opts); currentCleanups.push(function(){ t.removeEventListener(ev, fn, opts); }); }


function toCamel(p) { return p.replace(/-([a-z])/g, function(_, c){ return c.toUpperCase(); }); }
function applyHoverEffects(root) {
  var els = Array.from(root.querySelectorAll('[style-hover]'));
  els.forEach(function(el) {
    var decl = el.getAttribute('style-hover');
    var pairs = decl.split(';').map(function(s){ return s.trim(); }).filter(Boolean).map(function(s){
      var idx = s.indexOf(':');
      return [toCamel(s.slice(0, idx).trim()), s.slice(idx+1).trim()];
    });
    var originals = pairs.map(function(p){ return el.style[p[0]]; });
    on(el, 'mouseenter', function(){ pairs.forEach(function(p){ el.style[p[0]] = p[1]; }); });
    on(el, 'mouseleave', function(){ pairs.forEach(function(p, i){ el.style[p[0]] = originals[i]; }); });
  });
}

function mountGeneric(root) {
  applyHoverEffects(root);
  var nav = root.querySelector('[data-role="nav"]');
  function onNav() {
    if (!nav) return;
    var s = scrollTop() > 40;
    nav.style.padding = s ? '14px 40px' : '22px 40px';
    nav.style.background = s ? 'rgba(0,0,0,0.55)' : 'linear-gradient(180deg, rgba(0,0,0,0.6), transparent)';
    nav.style.backdropFilter = s ? 'blur(18px)' : 'blur(0px)';
    nav.style.webkitBackdropFilter = s ? 'blur(18px)' : 'blur(0px)';
    nav.style.borderBottomColor = s ? 'rgba(245,243,238,0.08)' : 'transparent';
  }
  on(window, 'scroll', onNav, {passive:true});
  onNav();

  var tilt = root.querySelector('[data-role="tilt"]'), wrap = root.querySelector('[data-role="hero-visual"]');
  if (tilt && wrap) {
    var tx=0, ty=0, tsy=scrollTop();
    function apply(){ tilt.style.transform = 'rotateX('+(ty*-8+tsy*0.02)+'deg) rotateY('+(tx*10)+'deg) rotateZ('+(tsy*0.03)+'deg)'; }
    on(window, 'mousemove', function(e){
      var r = wrap.getBoundingClientRect();
      tx = ((e.clientX-r.left)/r.width-0.5)*2; ty = ((e.clientY-r.top)/r.height-0.5)*2; apply();
    });
    on(wrap, 'mouseleave', function(){ tx=0; ty=0; apply(); });
    on(window, 'scroll', function(){ tsy = scrollTop(); apply(); }, {passive:true});
    apply();
  }

  var els = Array.from(root.querySelectorAll('[data-reveal]'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) { e.target.style.opacity='1'; e.target.style.transform='translateY(0)'; } });
    }, { threshold: 0, rootMargin: '0px 0px -40px 0px' });
    els.forEach(function(el){ io.observe(el); });
    currentCleanups.push(function(){ io.disconnect(); });
  } else {
    els.forEach(function(el){ el.style.opacity='1'; el.style.transform='none'; });
  }
}

    on(btn, 'click', function(){
      var label = btn.getAttribute('data-label');
      var right = label === correct;
      buttons.forEach(function(b){
        var isPicked = b === btn, isRight = b.getAttribute('data-label') === correct;
        var tick = b.querySelector('.tick');
        if (isRight) { b.style.border = '1px solid #F5F3EE'; b.style.background = 'rgba(245,243,238,0.10)'; b.style.color = '#F5F3EE'; tick.textContent = '✓'; }
        else if (isPicked) { b.style.border = '1px solid rgba(245,243,238,0.35)'; b.style.background = 'rgba(245,243,238,0.02)'; b.style.color = '#8E8C86'; tick.textContent = '✕'; }
        else { b.style.color = '#8E8C86'; b.style.background = 'transparent'; b.style.border = '1px solid rgba(245,243,238,0.08)'; tick.textContent = ''; }
      });
      verdictBox.style.display = 'flex';
      title.textContent = right ? 'Correct' : 'Not quite';
      body.textContent = right
        ? 'A square, moving clockwise. You solved it in seconds without being told what to look for — that is the whole point.'
        : 'The answer is a square moving clockwise. Watch once more: let your eyes rest on the middle of the field rather than hunting for edges.';
    });
  });
}

function mountAletheia(root) {
  var btn = root.querySelector('#aletheia-download-btn'), box = root.querySelector('#aletheia-coming-soon');
  if (btn && box) on(btn, 'click', function(){ box.style.display = 'flex'; });
}

function mountApply(root) {
  var form = root.querySelector('#apply-form');
  if (form) on(form, 'submit', function(e){
    e.preventDefault();
    root.querySelector('#apply-form-wrap').style.display = 'none';
    root.querySelector('#apply-success').style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function mountMx(root) {
  var wide = root.querySelector('#mx-wide-diagram'), stack = root.querySelector('#mx-stack-diagram');
  function apply() {
    var narrow = window.matchMedia('(max-width: 900px)').matches;
    if (wide) wide.style.display = narrow ? 'none' : 'block';
    if (stack) stack.style.display = narrow ? 'block' : 'none';
  }
  apply();
  on(window, 'resize', apply);
}

var PAGE_MOUNTS = { virtus: mountVirtus, aletheia: mountAletheia, apply: mountApply, mx: mountMx };

function mountRoute(route) {
  currentCleanups.forEach(function(f){ f(); });
  currentCleanups = [];
  var key = ROUTE_MAP[route] || 'home';
  var html = PAGES[key] || PAGES.home;
  var app = document.getElementById('app');
  app.innerHTML = html;
  mountGeneric(app);
  if (PAGE_MOUNTS[key]) PAGE_MOUNTS[key](app);
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', function(){ mountRoute(location.hash.slice(1)); });
window.addEventListener('DOMContentLoaded', function(){
  setupSharedOverlay();
  mountRoute(location.hash.slice(1) || 'home');
});
</script>
